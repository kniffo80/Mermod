plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    api(include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.fcap_version"))
    implementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    implementation "eu.pb4:trinkets:$rootProject.trinkets_version"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cca_version"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cca_version"
    implementation "net.caffeinemc:sodium-fabric:$rootProject.sodium_version"
    implementation "maven.modrinth:iris:$rootProject.iris_version-fabric"
    implementation "org.anarres:jcpp:1.4.14"
    implementation "io.github.douira:glsl-transformer:3.0.0-pre3"
    implementation "org.antlr:antlr4-runtime:4.13.1"
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            fabric_loader_version: fabric_loader_version,
            minecraft_version: minecraft_version,
            architectury_api_version: architectury_api_version
    ]
    inputs.properties replaceProperties
    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
    // The access widener lives in the common module; copy it into this mod's own
    // resources so Fabric Loader can resolve it in the dev runtime as well.
    from(project(':common').file('src/main/resources/mermod.accesswidener'))
}

jar {
    archiveClassifier = "raw"
}

// Loom nests `include()`d mods (e.g. forgeconfigapiport) as Jar-in-Jar files
// under META-INF/jars in the raw jar. Shadow unpacks any jar it copies,
// which would explode the nested mod (duplicate fabric.mod.json, missing JiJ).
// So the nested jars are excluded from the shadow spec, staged via
// extractNestedJars, and re-injected as plain files in shadowJar.doLast.
def extractNestedJars = tasks.register('extractNestedJars', Copy) {
    dependsOn(jar)
    from(zipTree(jar.archiveFile)) {
        include 'META-INF/jars/*.jar'
    }
    into layout.buildDirectory.dir('nested-jars')
}

shadowJar {
    dependsOn(jar, extractNestedJars)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile)) {
        exclude 'META-INF/jars/*.jar'
    }
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    doLast {
        // Shadow unpacks nested Jar-in-Jar mods; re-add them as plain files.
        ant.zip(destfile: archiveFile.get().asFile, update: true) {
            fileset(dir: extractNestedJars.get().destinationDir) {
                include(name: 'META-INF/jars/*.jar')
            }
        }
    }
}
